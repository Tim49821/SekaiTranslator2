name: Core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.8'
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.8'
          - os: windows-latest
            python: '3.11'
          - os: macos-14
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      BALLOONTRANS_SKIP_HF_MODEL_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q launch.py headless_server.py relay_server.py local_worker.py modules ui utils tests
      - name: Run core regression suite
        run: >-
          python -m unittest -v
          tests.test_python_compat
          tests.test_lazy_runtime
          tests.test_config_template
          tests.test_api_security
          tests.test_api_uploads
          tests.test_relay_jobs
          tests.test_relay_api
          tests.test_local_worker
          tests.test_headless_api
          tests.test_updater
      - name: Check installed requirements
        run: python -m pip check
